<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المنتجات | Tech Store</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="site-header">
        <div class="container d-flex justify-content-between align-items-center flex-wrap gap-3">
            <h1 class="site-title">Tech Store</h1>
            <nav class="main-nav">
                <a href="index.html">الرئيسية</a>
                <a href="products.html">المنتجات</a>
                <a href="cart.html">السلة</a>
                <a href="orders.html">طلباتي</a>
                <a href="admin.html">الإدارة</a>
            </nav>
        </div>
    </header>

    <main class="container page-section">
        <h2 class="section-title">جميع المنتجات</h2>
        <p>ابحثي عن منتج أو اختاري تصنيفًا أو طريقة للترتيب.</p>

        <!-- نبدأ بثلاث أدوات بسيطة، ثم يمكننا إضافة مرشحات أكثر لاحقًا -->
        <section class="row g-3 mb-4" aria-label="البحث عن المنتجات">
            <div class="col-12 col-md-4">
                <label for="searchInput" class="form-label">البحث عن منتج</label>
                <input id="searchInput" class="form-control" type="search" placeholder="اكتبي اسم المنتج">
            </div>

            <div class="col-12 col-md-4">
                <label for="categorySelect" class="form-label">التصنيف</label>
                <select id="categorySelect" class="form-select">
                    <option value="all">كل التصنيفات</option>
                    <option value="هواتف">هواتف</option>
                    <option value="لابتوبات">لابتوبات</option>
                    <option value="سماعات">سماعات</option>
                    <option value="إكسسوارات">إكسسوارات</option>
                </select>
            </div>

            <div class="col-12 col-md-4">
                <label for="sortSelect" class="form-label">ترتيب حسب السعر</label>
                <select id="sortSelect" class="form-select">
                    <option value="default">الترتيب الافتراضي</option>
                    <option value="low">السعر من الأقل للأعلى</option>
                    <option value="high">السعر من الأعلى للأقل</option>
                </select>
            </div>

            <div class="col-12">
                <button id="clearFilters" class="btn btn-outline-secondary" type="button">مسح البحث والاختيارات</button>
            </div>
        </section>

        <p id="productsMessage" aria-live="polite"></p>
        <section id="productsList" class="row g-3" aria-label="قائمة المنتجات"></section>
    </main>

    <footer class="site-footer text-center">
        <div class="container">
            <h2>Tech Store</h2>
            <p>متجرك الإلكتروني لأحدث الأجهزة والتقنيات.</p>
            <p>جميع الحقوق محفوظة لمتجر Tech Store &copy; 2026</p>
        </div>
    </footer>

    <script src="js/product-data.js"></script>
    <script src="js/products.js"></script>
</body>
</html>
