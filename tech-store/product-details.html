<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل المنتج | Tech Store</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="site-header">
        <div class="container d-flex justify-content-between align-items-center flex-wrap gap-3">
            <h1 class="site-title">Tech Store</h1>
            <nav class="main-nav">
                <a href="index.html">الرئيسية</a>
                <a href="products.html">المنتجات</a>
                <a href="cart.html">السلة</a>
                <a href="orders.html">طلباتي</a>
                <a href="admin.html">الإدارة</a>
            </nav>
        </div>
    </header>

    <main class="container page-section">
        <a href="products.html" class="btn btn-link px-0">العودة إلى المنتجات</a>
        <div id="detailsMessage" aria-live="polite"></div>
        <section id="productDetails" class="product-details" hidden>
            <img id="detailImage" src="" alt="">
            <div>
                <p id="detailCategory"></p>
                <h2 id="detailName" class="section-title"></h2>
                <p id="detailDescription"></p>
                <p class="product-price"><span id="detailPrice"></span> دولار</p>
                <p id="detailStock"></p>

                <div class="quantity-control">
                    <label for="productQuantity" class="form-label">الكمية</label>
                    <input id="productQuantity" class="form-control" type="number" min="1" value="1">
                    <p id="quantityError" class="text-danger mt-2" aria-live="polite"></p>
                </div>

                <button id="detailAddButton" class="btn btn-primary">أضيفي إلى السلة</button>
            </div>
        </section>
    </main>

    <footer class="site-footer text-center">
        <div class="container">
            <h2>Tech Store</h2>
            <p>متجرك الإلكتروني لأحدث الأجهزة والتقنيات.</p>
            <p>جميع الحقوق محفوظة لمتجر Tech Store &copy; 2026</p>
        </div>
    </footer>

    <script src="js/product-data.js"></script>
    <script src="js/product-details.js"></script>
</body>
</html>
