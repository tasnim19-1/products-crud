<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سلة المشتريات | Tech Store</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="site-header">
        <div class="container d-flex justify-content-between align-items-center flex-wrap gap-3">
            <h1 class="site-title">Tech Store</h1>

            <nav class="main-nav">
                <a href="index.html">الرئيسية</a>
                <a href="products.html">المنتجات</a>
                <a href="cart.html">السلة</a>
                <a href="orders.html">طلباتي</a>
                <a href="admin.html">الإدارة</a>
            </nav>
        </div>
    </header>

    <main class="container page-section">
        <h2 class="section-title">سلة المشتريات</h2>

        <div id="cartMessage" class="mb-3" aria-live="polite"></div>
        <section id="cartItems" class="row g-3" aria-label="المنتجات في السلة"></section>

        <section id="cartSummary" class="cart-summary mt-4">
            <h3>ملخص الطلب</h3>
            <p>المجموع الفرعي: <span id="subtotal">0</span> دولار</p>
            <p>الخصم: <span id="discount">0</span> دولار</p>
            <p class="product-price">الإجمالي: <span id="total">0</span> دولار</p>

            <button id="clearCartButton" class="btn btn-outline-danger">تفريغ السلة</button>
            <a id="checkoutLink" class="btn btn-primary" href="checkout.html">متابعة لإتمام الطلب</a>
        </section>

        <a class="btn btn-link mt-3" href="products.html">العودة إلى المنتجات</a>
    </main>

    <footer class="site-footer text-center">
        <div class="container">
            <h2>Tech Store</h2>
            <p>متجرك الإلكتروني لأحدث الأجهزة والتقنيات.</p>
            <p>جميع الحقوق محفوظة لمتجر Tech Store &copy; 2026</p>
        </div>
    </footer>

    <script src="js/cart.js"></script>
</body>
</html>
